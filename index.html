<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Al Burooj – Chat Widget Demo</title>
<style>
  /* ── PAGE DEMO BACKGROUND ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #333;
  }
  .demo-page {
    text-align: center;
    padding: 40px 20px;
  }
  .demo-page h1 { font-size: 28px; color: #144a91; margin-bottom: 8px; }
  .demo-page p  { color: #666; font-size: 15px; }

  /* ══════════════════════════════════════════
     CHAT WIDGET
  ══════════════════════════════════════════ */
  :root {
    --primary:   #144a91;
    --primary-d: #0f3870;
    --primary-l: #e8eef8;
    --gold:      #c9a84c;
    --white:     #ffffff;
    --bg:        #f5f7fa;
    --text:      #1a1a2e;
    --muted:     #6b7280;
    --radius:    16px;
    --shadow:    0 8px 32px rgba(20,74,145,.18);
  }

  /* ── LAUNCHER BUBBLE ── */
  #ab-launcher {
    position: fixed;
    bottom: 28px;
    right: 28px;
    width: 62px;
    height: 62px;
    background: var(--primary);
    border-radius: 50%;
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: transform .2s, box-shadow .2s;
    border: none;
    outline: none;
  }
  #ab-launcher:hover { transform: scale(1.08); box-shadow: 0 12px 36px rgba(20,74,145,.28); }
  #ab-launcher svg   { width: 28px; height: 28px; fill: var(--white); transition: opacity .2s; }
  #ab-launcher .icon-close { display: none; }

  /* unread badge */
  #ab-badge {
    position: absolute;
    top: -2px; right: -2px;
    width: 18px; height: 18px;
    background: #e63946;
    border-radius: 50%;
    border: 2px solid var(--white);
    font-size: 10px;
    font-weight: 700;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── CHAT WINDOW ── */
  #ab-window {
    position: fixed;
    bottom: 104px;
    right: 28px;
    width: 380px;
    max-width: calc(100vw - 32px);
    height: 580px;
    max-height: calc(100vh - 130px);
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 9998;
    transform: scale(.92) translateY(16px);
    opacity: 0;
    pointer-events: none;
    transition: transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s;
  }
  #ab-window.open {
    transform: scale(1) translateY(0);
    opacity: 1;
    pointer-events: all;
  }

  /* ── HEADER ── */
  .ab-header {
    background: var(--primary);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .ab-avatar {
    width: 42px; height: 42px;
    background: var(--white);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 20px;
  }
  .ab-header-info { flex: 1; }
  .ab-header-name {
    font-size: 15px; font-weight: 700;
    color: var(--white); line-height: 1.2;
  }
  .ab-header-sub {
    font-size: 11.5px; color: rgba(255,255,255,.75);
    display: flex; align-items: center; gap: 5px; margin-top: 2px;
  }
  .ab-online-dot {
    width: 7px; height: 7px;
    background: #4ade80; border-radius: 50%;
  }

  /* ── MESSAGES AREA ── */
  .ab-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--bg);
    scroll-behavior: smooth;
  }
  .ab-messages::-webkit-scrollbar { width: 4px; }
  .ab-messages::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

  /* ── BUBBLES ── */
  .ab-msg { display: flex; flex-direction: column; max-width: 86%; }
  .ab-msg.bot { align-self: flex-start; }
  .ab-msg.user { align-self: flex-end; }

  .ab-bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 13.5px;
    line-height: 1.55;
    word-break: break-word;
  }
  .ab-msg.bot  .ab-bubble {
    background: var(--white);
    color: var(--text);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .ab-msg.user .ab-bubble {
    background: var(--primary);
    color: var(--white);
    border-bottom-right-radius: 4px;
  }
  .ab-time {
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 3px;
    padding: 0 4px;
  }
  .ab-msg.user .ab-time { text-align: right; }

  /* ── TYPING INDICATOR ── */
  .ab-typing { display: flex; gap: 5px; padding: 12px 14px; align-self: flex-start; }
  .ab-typing span {
    width: 7px; height: 7px;
    background: #94a3b8;
    border-radius: 50%;
    animation: ab-bounce .9s infinite ease-in-out;
  }
  .ab-typing span:nth-child(2) { animation-delay: .15s; }
  .ab-typing span:nth-child(3) { animation-delay: .30s; }
  @keyframes ab-bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40%           { transform: translateY(-6px); }
  }
  .ab-typing-wrap {
    background: var(--white);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
    align-self: flex-start;
  }

  /* ── BUTTON CHOICES ── */
  .ab-choices {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-self: flex-start;
    max-width: 90%;
  }
  .ab-choice-btn {
    background: var(--white);
    border: 1.5px solid var(--primary);
    color: var(--primary);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: background .15s, color .15s, transform .1s;
    line-height: 1.3;
  }
  .ab-choice-btn:hover {
    background: var(--primary);
    color: var(--white);
    transform: translateX(2px);
  }
  .ab-choice-btn:disabled {
    opacity: .45;
    cursor: default;
    pointer-events: none;
  }

  /* ── ENQUIRY FORM ── */
  .ab-form-card {
    background: var(--white);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    align-self: flex-start;
    width: 100%;
    max-width: 310px;
  }
  .ab-form-card h4 {
    font-size: 13.5px;
    color: var(--primary);
    margin-bottom: 10px;
    font-weight: 700;
  }
  .ab-form-field {
    margin-bottom: 8px;
  }
  .ab-form-field label {
    display: block;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 3px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .ab-form-field input, .ab-form-field select {
    width: 100%;
    border: 1.5px solid #e2e8f0;
    border-radius: 8px;
    padding: 7px 10px;
    font-size: 13px;
    color: var(--text);
    outline: none;
    transition: border .15s;
    background: var(--bg);
  }
  .ab-form-field input:focus, .ab-form-field select:focus {
    border-color: var(--primary);
    background: var(--white);
  }
  .ab-form-submit {
    width: 100%;
    background: var(--primary);
    color: var(--white);
    border: none;
    border-radius: 8px;
    padding: 9px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: background .15s;
  }
  .ab-form-submit:hover { background: var(--primary-d); }

  /* ── FOOTER / POWERED BY ── */
  .ab-footer {
    padding: 8px 14px;
    text-align: center;
    font-size: 11px;
    color: #b0b7c3;
    border-top: 1px solid #f0f0f0;
    flex-shrink: 0;
    background: var(--white);
  }
  .ab-footer a { color: var(--primary); text-decoration: none; font-weight: 600; }

  /* ── RESTART BUTTON ── */
  .ab-restart {
    align-self: center;
    background: none;
    border: 1px solid #e2e8f0;
    color: var(--muted);
    border-radius: 12px;
    padding: 5px 14px;
    font-size: 11.5px;
    cursor: pointer;
    margin-top: 4px;
    transition: border-color .15s, color .15s;
  }
  .ab-restart:hover { border-color: var(--primary); color: var(--primary); }

  /* ── RESPONSIVE ── */
  @media (max-width: 440px) {
    #ab-window { right: 12px; bottom: 96px; width: calc(100vw - 24px); }
    #ab-launcher { right: 16px; bottom: 20px; }
  }
</style>
</head>
<body>

<!-- Demo page background -->
<div class="demo-page">
  <h1>Al Burooj International School</h1>
  <p>Click the chat bubble in the bottom-right corner to try the chatbot.</p>
</div>

<!-- ══════════════════════════════════════════
     CHAT LAUNCHER BUTTON
══════════════════════════════════════════ -->
<button id="ab-launcher" aria-label="Open chat" onclick="abToggle()">
  <div id="ab-badge">1</div>
  <!-- Chat icon -->
  <svg class="icon-chat" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M20 2H4C2.9 2 2 2.9 2 4v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 10H6v-2h12v2zm0-3H6V7h12v2z"/>
  </svg>
  <!-- Close icon -->
  <svg class="icon-close" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
  </svg>
</button>

// ── FOLLOW-UP CHOICES ──────────────────────
function getFollowUp(branch) {
  return [
    { label: "🔙 Ask another question",   next: branch === 'juniors' ? 'juniors_menu' : 'primary_menu' },
    { label: "📝 Submit an enquiry",      next: 'enquiry_form' },
    { label: "🔀 Change branch",          next: 'greeting' },
  ];
}

// ── UTILS ──────────────────────────────────
function abNow() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function abScroll() {
  const m = document.getElementById('ab-messages');
  setTimeout(() => m.scrollTop = m.scrollHeight, 60);
}

function abDisableChoices() {
  document.querySelectorAll('.ab-choice-btn').forEach(b => b.disabled = true);
  abChoicesDisabled = true;
}

// ── RENDER ─────────────────────────────────
function renderBotMsg(text, delay = 0) {
  return new Promise(resolve => {
    const msgs = document.getElementById('ab-messages');

    // typing indicator
    const typingWrap = document.createElement('div');
    typingWrap.className = 'ab-typing-wrap';
    typingWrap.innerHTML = `<div class="ab-typing"><span></span><span></span><span></span></div>`;
    msgs.appendChild(typingWrap);
    abScroll();

    setTimeout(() => {
      typingWrap.remove();

      const wrap = document.createElement('div');
      wrap.className = 'ab-msg bot';

      const bubble = document.createElement('div');
      bubble.className = 'ab-bubble';
      bubble.style.whiteSpace = 'pre-line';
      bubble.textContent = text;

      const time = document.createElement('div');
      time.className = 'ab-time';
      time.textContent = abNow();

      wrap.appendChild(bubble);
      wrap.appendChild(time);
      msgs.appendChild(wrap);
      abScroll();
      resolve();
    }, delay || Math.min(600 + text.length * 5, 1600));
  });
}

function renderUserMsg(text) {
  const msgs = document.getElementById('ab-messages');
  const wrap = document.createElement('div');
  wrap.className = 'ab-msg user';
  wrap.innerHTML = `<div class="ab-bubble">${text}</div><div class="ab-time">${abNow()}</div>`;
  msgs.appendChild(wrap);
  abScroll();
}

function renderChoices(choices) {
  const msgs = document.getElementById('ab-messages');
  const wrap = document.createElement('div');
  wrap.className = 'ab-choices';
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'ab-choice-btn';
    btn.textContent = c.label;
    btn.onclick = () => handleChoice(c);
    wrap.appendChild(btn);
  });
  msgs.appendChild(wrap);
  abScroll();
}

function renderEnquiryForm() {
  const msgs = document.getElementById('ab-messages');
  const card = document.createElement('div');
  card.className = 'ab-form-card';
  card.innerHTML = `
    <h4>📝 Submit an Enquiry</h4>
    <div class="ab-form-field">
      <label>Your Name</label>
      <input type="text" id="ab-f-name" placeholder="Parent / Guardian name"/>
    </div>
    <div class="ab-form-field">
      <label>Phone Number</label>
      <input type="tel" id="ab-f-phone" placeholder="+91 XXXXX XXXXX"/>
    </div>
    <div class="ab-form-field">
      <label>Child's Name</label>
      <input type="text" id="ab-f-child" placeholder="Child's full name"/>
    </div>
    <div class="ab-form-field">
      <label>Applying For</label>
      <select id="ab-f-grade">
        <option value="">Select grade / class</option>
        <option>Pre-KG (Juniors)</option>
        <option>KG (Juniors)</option>
        <option>Grade 1</option><option>Grade 2</option><option>Grade 3</option>
        <option>Grade 4</option><option>Grade 5</option><option>Grade 6</option>
        <option>Grade 7</option><option>Grade 8</option><option>Grade 9</option>
        <option>Grade 10</option>
      </select>
    </div>
    <button class="ab-form-submit" onclick="abSubmitForm()">Submit Enquiry →</button>
  `;
  msgs.appendChild(card);
  abScroll();
}

function renderRestart() {
  const msgs = document.getElementById('ab-messages');
  const btn = document.createElement('button');
  btn.className = 'ab-restart';
  btn.textContent = '↺ Start over';
  btn.onclick = () => abRestart();
  msgs.appendChild(btn);
  abScroll();
}

// ── FORM SUBMIT ────────────────────────────
const AB_SHEET_URL = "https://script.google.com/macros/s/AKfycbzGnv3TOzWnbUP0-JKcPVFyEBfBj_c9HfSsz_Sw-8B7sKYgDVuk3w6CmHf_kf7LVcC7xQ/exec";

async function abSubmitForm() {
  const name  = document.getElementById('ab-f-name')?.value.trim();
  const phone = document.getElementById('ab-f-phone')?.value.trim();
  const child = document.getElementById('ab-f-child')?.value.trim();
  const grade = document.getElementById('ab-f-grade')?.value;

  if (!name || !phone || !child || !grade) {
    alert('Please fill in all fields before submitting.');
    return;
  }

  // Disable submit button to prevent double submits
  const btn = document.querySelector('.ab-form-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Sending...'; }

  // Remove form card
  document.querySelectorAll('.ab-form-card').forEach(el => el.remove());

  renderUserMsg(`📝 ${name} · ${phone} · ${child} · ${grade}`);

  // Send to Google Sheets
  try {
    await fetch(AB_SHEET_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name,
        phone,
        child,
        grade,
        branch: abBranch === 'juniors' ? 'Al Burooj Juniors' : 'Al Burooj International School'
      })
    });
  } catch (err) {
    // Silent fail — don't break UX if network issue
    console.warn('Sheet submission error:', err);
  }

  // Thank you message regardless of network result
  renderBotMsg(
    `Jazakallahu Khair, ${name}! 🌟\n\nYour enquiry has been received. Our admissions team will reach out to you shortly on ${phone}.\n\nWe look forward to welcoming ${child} to the Al Burooj family, insha'Allah. 🌙`
  ).then(() => {
    renderRestart();
  });
}

// ── HANDLE CHOICE ──────────────────────────
async function handleChoice(choice) {
  abDisableChoices();

  // Show as user bubble
  renderUserMsg(choice.label);

  const step = choice.next;

  if (step === 'enquiry_form') {
    await renderBotMsg("Sure! Please fill in your details below and our admissions team will get back to you. 😊");
    renderEnquiryForm();
    return;
  }

  const node = FLOW[step];
  if (!node) return;

  // Track branch
  if (node.branch) abBranch = node.branch;

  await renderBotMsg(node.msg);

  if (node.choices) {
    renderChoices(node.choices);
  } else if (node.followUp) {
    renderChoices(getFollowUp(abBranch));
  }
}

// ── TOGGLE WINDOW ──────────────────────────
function abToggle() {
  abOpen = !abOpen;
  const win = document.getElementById('ab-window');
  const badge = document.getElementById('ab-badge');
  const chatIcon  = document.querySelector('.icon-chat');
  const closeIcon = document.querySelector('.icon-close');

  if (abOpen) {
    win.classList.add('open');
    badge.style.display = 'none';
    chatIcon.style.display = 'none';
    closeIcon.style.display = 'block';
    if (document.getElementById('ab-messages').children.length === 0) {
      abStart();
    }
  } else {
    win.classList.remove('open');
    chatIcon.style.display = 'block';
    closeIcon.style.display = 'none';
  }
}

// ── START ──────────────────────────────────
async function abStart() {
  abStep = 'greeting';
  abBranch = null;
  const node = FLOW.greeting;
  await renderBotMsg(node.msg, 800);
  renderChoices(node.choices);
}

// ── RESTART ────────────────────────────────
function abRestart() {
  document.getElementById('ab-messages').innerHTML = '';
  abBranch = null;
  abChoicesDisabled = false;
  abStart();
}
</script>
